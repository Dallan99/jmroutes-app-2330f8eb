# Configuração preparada com os valores não sensíveis conferidos no painel
# em 15/10/2026 (release v62). Ainda requer validação e publicação explícita.
app = "jmroutes-meli-worker-esp16"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "Dockerfile.mobile"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  MOBILE_PUBLIC_ORIGIN = "https://jmroutes-meli-worker-esp16.fly.dev"
  SESSION_FILE_PATH = "/data/adminml-session.enc"
  JMR_SESSION_FILE_PATH = "/data/jmr-session.enc"
  MOBILE_RECEIPT_PATH = "/data/mobile-receipt"
  ADMINML_LOGIN_MODE = "mobile"
  SYNC_INTERVAL_SECONDS = "180"
  # Preserva o modo publicado: escrita somente no piloto isolado.
  # DRY_RUN=true + PILOT_WRITE=true NÃO significa ausência de gravação:
  # grava em meli_piloto_*, sem promover para a operação.
  DRY_RUN = "true"
  PILOT_WRITE = "true"
  BASE_CODES = "ESP15,ESP16,ESP17,ESP18"
  JMR_BASE_URL = "https://jmroutes.app"
  SUPABASE_URL = "https://zfmwojloamwggahjxlyt.supabase.co"
  # Preserve secrets existentes; acrescente MOBILE_ACCESS_KEY em canal seguro.
[[mounts]]
  source = "meli_session"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
[deploy]
  strategy = "immediate"
