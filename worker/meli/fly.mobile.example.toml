# Copie e configure antes de publicar. Não substitui o piloto atual.
app = "PREENCHER-APP-DO-INICIADOR"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"
[build]
  dockerfile = "Dockerfile.mobile"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  MOBILE_PUBLIC_ORIGIN = "https://PREENCHER-APP-DO-INICIADOR.fly.dev"
  SESSION_FILE_PATH = "/data/adminml-session.enc"
  JMR_SESSION_FILE_PATH = "/data/jmr-session.enc"
  MOBILE_RECEIPT_PATH = "/data/mobile-receipt"
  ADMINML_LOGIN_MODE = "mobile"
  SYNC_INTERVAL_SECONDS = "60"
  # Primeiro teste sem gravação. Promover explicitamente após validar destino,
  # usuário técnico, permissões por base e impedir coletores duplicados.
  DRY_RUN = "true"
  BASE_CODES = "ESP16"
  JMR_BASE_URL = "https://jmroutes.app"
  # SUPABASE_URL, SUPABASE_ANON_KEY e credenciais: configurar no ambiente.
[[mounts]]
  source = "meli_session"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
[deploy]
  strategy = "immediate"
