name: Recuperar worker Meli
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jmroutes-recuperacao.yml'
permissions:
  contents: read
concurrency:
  group: jmroutes-fly-recuperacao
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Conferir backups e opções de recuperação
        run: |
          flyctl status -a jmroutes-meli-worker-esp16
          flyctl volumes snapshots list vol_458jmm22om03xpx4 -a jmroutes-meli-worker-esp16
          flyctl machine clone --help
          flyctl machine update --help
      - name: Ler configuração não sensível da máquina
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.machines.dev/v1/apps/jmroutes-meli-worker-esp16/machines/d8946d0f7360d8'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['FLY_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=60) as r: m=json.load(r)
          c=m.get('config',{})
          print(json.dumps({k:m.get(k) for k in ['id','state','region','name']},indent=2))
          print(json.dumps({k:c.get(k) for k in ['image','init','guest','mounts','services','restart','metadata']},indent=2))
          e=c.get('env',{})
          print('Modo:',{k:e.get(k) for k in ['DRY_RUN','PILOT_WRITE','ADMINML_LOGIN_MODE','PORT','MOBILE_PUBLIC_ORIGIN']})
          PY
