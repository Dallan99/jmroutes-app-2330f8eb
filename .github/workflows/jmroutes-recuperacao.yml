name: Recuperar worker Meli
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jmroutes-recuperacao.yml'
permissions:
  contents: read
concurrency:
  group: jmroutes-fly-recuperacao
  cancel-in-progress: false
jobs:
  recuperar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 116b7d4a1099dd1d26002b573bb115f52b0c2be0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Restaurar backup e criar máquina substituta
        run: |
          python3 -u - <<'PY'
          import os,json,urllib.request,urllib.error,tomllib,time
          base='https://api.machines.dev/v1/apps/jmroutes-meli-worker-esp16'
          def api(path,body=None):
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['FLY_API_TOKEN'],'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=180) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print('Fly API:',e.code,e.read().decode()[:1200])
                  raise
          machines=api('/machines')
          existing=[m for m in machines if m.get('name')=='jmroutes-mobile-recuperado']
          if existing:
              machine=existing[0]
              print('Reutilizando substituta:',machine['id'])
          else:
              volumes=api('/volumes')
              restored=[v for v in volumes if v['name']=='meli_rec_20261017']
              if restored:
                  volume=restored[0]
              else:
                  volume=api('/volumes',{'name':'meli_rec_20261017','region':'gru','size_gb':1,'encrypted':True,'require_unique_zone':True,'snapshot_id':'vs_vJBxyzneL9As2L4QOGPLzPJ','auto_backup_enabled':True,'snapshot_retention':5})
              print('Volume restaurado:',volume['id'],'estado:',volume.get('state'))
              cfg=tomllib.load(open('worker/meli/fly.mobile.example.toml','rb'))
              env=cfg['env']
              assert env['DRY_RUN']=='true' and env['PILOT_WRITE']=='true'
              config={
                  'image':'registry.fly.io/jmroutes-meli-worker-esp16@sha256:cf980912717a40171e7e0d11dbeaed763c9197009531db18438329e998bc0904',
                  'env':env,'guest':{'cpu_kind':'shared','cpus':1,'memory_mb':1024},
                  'init':{'cmd':['node','dist/mobile/main.js']},
                  'mounts':[{'volume':volume['id'],'path':'/data'}],
                  'restart':{'policy':'always'},
                  'metadata':{'fly_process_group':'app','recovery_source':'d8946d0f7360d8','source_commit':'116b7d4a1099dd1d26002b573bb115f52b0c2be0'},
                  'services':[{'protocol':'tcp','internal_port':8080,'autostart':True,'autostop':'off','min_machines_running':1,
                    'ports':[{'port':80,'handlers':['http'],'force_https':True},{'port':443,'handlers':['tls','http']}],
                    'checks':[{'type':'http','port':8080,'path':'/health','method':'GET','interval':'30s','timeout':'5s','grace_period':'30s'}]}]
              }
              machine=api('/machines',{'name':'jmroutes-mobile-recuperado','region':'gru','config':config,'skip_secrets':False})
              print('Máquina substituta:',machine['id'],'estado:',machine.get('state'))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('RECOVERED_MACHINE='+machine['id']+'\n')
          PY
      - name: Conferir HTTP e chave de acesso sem expor credenciais
        env:
          MOBILE_ACCESS_KEY: ${{ secrets.MOBILE_ACCESS_KEY }}
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,os,time
          base='https://jmroutes-meli-worker-esp16.fly.dev'
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def req(path,body=None,csrf=None):
              h={'Origin':base}
              if body is not None: h['Content-Type']='application/json'
              if csrf: h['X-CSRF-Token']=csrf
              r=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=h)
              with client.open(r,timeout=45) as response:
                  data=response.read()
                  print(path,response.status,'bytes',len(data))
                  return data
          for attempt in range(24):
              try:
                  req('/health')
                  break
              except Exception as e:
                  print('Aguardando serviço:',type(e).__name__)
                  if attempt==23: raise
                  time.sleep(5)
          req('/')
          auth=json.loads(req('/login',{'secret':os.environ['MOBILE_ACCESS_KEY']}))
          status=json.loads(req('/status'))
          print('Estado:',status.get('state'),'modo:',status.get('mode'))
          assert status.get('mode')=='piloto'
          req('/logout',{},auth['csrf'])
          PY
      - name: Estado final e logs
        if: always()
        run: |
          flyctl status -a jmroutes-meli-worker-esp16
          flyctl checks list -a jmroutes-meli-worker-esp16
          flyctl logs -a jmroutes-meli-worker-esp16 --no-tail | tail -n 60
