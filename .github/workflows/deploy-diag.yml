name: Deploy do iniciador com erro visível
on:
  push:
    branches: [fix/iniciador-prova-navegacao]
    paths: [.github/workflows/deploy-diag.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/iniciador-movel-workers
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Deploy
        id: deploy
        working-directory: worker/meli
        run: |
          set -o pipefail
          if flyctl deploy --remote-only --ha=false --yes --config fly.mobile.example.toml -a jmroutes-meli-worker-esp16 > deploy.txt 2>&1; then
            echo "::warning title=deploy::OK $(git rev-parse --short HEAD)"
          else
            sed 's/\x1b\[[0-9;]*m//g' deploy.txt | grep -v '^\s*$' | tail -n 25 | cut -c1-300 | sed 's/^/::warning title=deploy-erro::/'
            echo "falhou=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Reiniciar máquina se o deploy falhar
        if: steps.deploy.outputs.falhou == '1'
        run: |
          flyctl machine restart d8946d0f7360d8 -a jmroutes-meli-worker-esp16 2>&1 | tail -n 3 | sed 's/^/::warning title=restart::/'
      - name: Estado
        if: always()
        run: flyctl status -a jmroutes-meli-worker-esp16 2>&1 | tail -n 8 | sed 's/^/::warning title=status::/'
