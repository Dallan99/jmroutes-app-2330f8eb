name: Publicar acesso móvel lembrado
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-jmroutes-mobile
  cancel-in-progress: false
jobs:
  reparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/jmroutes-meli-worker-esp16@sha256:c58a56c67cfcac1582104ac16750cd9b7f17069f79e5017c5fcc104272e277c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91e38d795a9e0276ce33038dd1363d1a1d7bfa09
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Validar
        working-directory: worker/meli
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm test
          npm run build
      - name: Atualizar somente a máquina recuperada
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,json,os
          url='https://api.machines.dev/v1/apps/jmroutes-meli-worker-esp16/machines/82d1e51a072148'
          headers={'Authorization':'Bearer '+os.environ['FLY_API_TOKEN'],'Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r: machine=json.load(r)
          config=machine['config']
          assert config['env']['DRY_RUN']=='true' and config['env']['PILOT_WRITE']=='true'
          assert config['mounts'][0]['volume']=='vol_4oj22wy6dx27nxpr'
          config['image']=os.environ['IMAGE']
          assert config.get('init',{}).get('cmd') == ['node','dist/mobile/main.js']
          config.setdefault('metadata',{})['source_commit']='91e38d795a9e0276ce33038dd1363d1a1d7bfa09'
          request=urllib.request.Request(url,headers=headers,data=json.dumps({'config':config}).encode())
          try:
              with urllib.request.urlopen(request,timeout=180) as r: result=json.load(r)
          except urllib.error.HTTPError as error:
              detail=error.read().decode('utf8',errors='replace')
              for value in list(config.get('env',{}).values())+[os.environ['FLY_API_TOKEN']]:
                  if isinstance(value,str) and value: detail=detail.replace(value,'[redacted]')
              print('Fly HTTP',error.code,detail[:2000])
              raise SystemExit(1)
          print('Máquina:',result['id'],'estado:',result['state'])
          PY
      - name: Confirmar serviço e proteções
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,time
          base='https://jmroutes-meli-worker-esp16.fly.dev'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(base+'/health',timeout=20) as r: assert r.status==200
                  break
              except Exception:
                  if attempt==23: raise
                  time.sleep(5)
          with urllib.request.urlopen(base+'/',timeout=20) as r:
              html=r.read().decode()
              assert 'Lembrar este celular por 30 dias' in html
          for path in ['/screen','/status','/session']:
              try: urllib.request.urlopen(base+path,timeout=20)
              except urllib.error.HTTPError as e: assert e.code==401
              else: raise AssertionError('Rota deve exigir login')
          print('Opção de 30 dias disponível; rotas privadas protegidas.')
          PY
