name: Pausar ou religar o coletor
on:
  push:
    branches: [fix/iniciador-prova-navegacao]
    paths: [.github/workflows/maquina-coletor.yml]
permissions:
  contents: read
env:
  ACAO: stop
jobs:
  maquina:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Executar
        run: |
          flyctl machine $ACAO d8946d0f7360d8 -a jmroutes-meli-worker-esp16 2>&1 | tail -n 3 | sed "s/^/::warning title=$ACAO::/"
          sleep 5
          flyctl machines list -a jmroutes-meli-worker-esp16 --json | python3 -c 'import json,sys
          for m in json.load(sys.stdin): print("::warning title=maquina::%s %s" % (m.get("id"), m.get("state")))'
