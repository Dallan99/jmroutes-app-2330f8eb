name: Diagnóstico em anotações
on:
  push:
    branches: [fix/iniciador-prova-navegacao]
    paths: [.github/workflows/diag-anotacoes.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Estado
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list -a jmroutes-meli-worker-esp16 --json | python3 -c 'import json,sys
          for m in json.load(sys.stdin): print("::warning title=maquina::%s %s %s img=%s" % (m.get("id"), m.get("state"), m.get("region"), (m.get("image_ref") or {}).get("tag")))'
      - name: Acesso
        env:
          MOBILE_ACCESS_KEY: ${{ secrets.MOBILE_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, os
          base='https://jmroutes-meli-worker-esp16.fly.dev'
          print("::warning title=chave::tamanho=%d" % len(os.environ.get('MOBILE_ACCESS_KEY','')))
          for path, body in [('/health',None),('/',None),('/login',{'secret':os.environ['MOBILE_ACCESS_KEY']})]:
              h={'Origin':base}
              if body is not None: h['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body else None,headers=h)
              try:
                  r=urllib.request.urlopen(req,timeout=40); code=r.status; txt=r.read()[:0]
              except urllib.error.HTTPError as e:
                  code=e.code; txt=e.read()[:200].decode('utf8','replace')
              except Exception as e:
                  code='ERRO'; txt=type(e).__name__
              print("::warning title=%s::%s %s" % (path, code, txt))
          PY
      - name: Logs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl logs -a jmroutes-meli-worker-esp16 --no-tail > logs.txt || true
          grep -c . logs.txt | sed 's/^/::warning title=linhas::/'
          sed 's/\x1b\[[0-9;]*m//g' logs.txt | tail -n 30 | cut -c1-330 | sed 's/^/::warning title=raw::/'
          python3 - <<'PY'
          import json,re
          for line in open('logs.txt',errors='replace'):
              m=re.search(r'(\{"ts".*\})\s*$', re.sub(r'\x1b\[[0-9;]*m','',line))
              if not m: continue
              try: o=json.loads(m.group(1))
              except Exception: continue
              meta=o.get('meta') or {}
              txt=json.dumps(meta,ensure_ascii=False)
              n=globals().setdefault('n',0)
              keep={k:v for k,v in meta.items() if not isinstance(v,(dict,list)) and k not in ('ciclo_id',)}
              globals()['n']+=1
              print("::warning title=%s %s::%s" % (o.get('ts','')[11:19], o.get('msg','')[:60], json.dumps(keep,ensure_ascii=False)[:600]))
          PY
