name: Verificar coleta Meli
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jmroutes-check-worker.yml'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Estado das máquinas
        run: flyctl status -a jmroutes-meli-worker-esp16
      - name: Logs atuais
        if: always()
        run: flyctl logs -a jmroutes-meli-worker-esp16 --no-tail | tail -n 100
