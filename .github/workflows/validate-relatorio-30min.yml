name: Validar report 30 min

on:
  push:
    branches:
      - feat/relatorio-30min-esp18
  pull_request:
    paths:
      - src/lib/meli-relatorio-30min.ts
      - src/lib/meli-relatorio-30min.functions.ts
      - src/routes/_authenticated/relatorio-30min.tsx
      - src/components/app-shell.tsx
      - tests/meli-relatorio-30min.test.ts
      - .github/workflows/validate-relatorio-30min.yml

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PNPM
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm install --no-frozen-lockfile
      - name: Teste do relatório
        run: pnpm test -- tests/meli-relatorio-30min.test.ts
      - name: Build e typecheck
        run: pnpm build
