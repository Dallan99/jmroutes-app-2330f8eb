name: Reparar iniciador Meli
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jmroutes-mobile-reparar
  cancel-in-progress: false
jobs:
  reparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/jmroutes-meli-worker-esp16:mobile-fix-e6ae77c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6ae77c4dd9a14dd2d8546a9a928ba247d597f41
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Validar
        working-directory: worker/meli
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm test
          npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.118
      - name: Construir sem usar builder afetado
        run: docker build -f worker/meli/Dockerfile.mobile -t "$IMAGE" worker/meli
      - name: Publicar imagem
        run: |
          flyctl auth docker
          docker push "$IMAGE"
      - name: Atualizar somente a máquina recuperada
        run: |
          python3 -u - <<'PY'
          import urllib.request,json,os
          url='https://api.machines.dev/v1/apps/jmroutes-meli-worker-esp16/machines/82d1e51a072148'
          headers={'Authorization':'Bearer '+os.environ['FLY_API_TOKEN'],'Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r: machine=json.load(r)
          config=machine['config']
          assert config['env']['DRY_RUN']=='true' and config['env']['PILOT_WRITE']=='true'
          assert config['mounts'][0]['volume']=='vol_4oj22wy6dx27nxpr'
          config['image']=os.environ['IMAGE']
          config['init']={'cmd':['node','dist/mobile/main.js']}
          config.setdefault('metadata',{})['source_commit']='e6ae77c4dd9a14dd2d8546a9a928ba247d597f41'
          request=urllib.request.Request(url,headers=headers,data=json.dumps({'config':config}).encode())
          with urllib.request.urlopen(request,timeout=180) as r: result=json.load(r)
          print('Máquina:',result['id'],'estado:',result['state'])
          PY
      - name: Confirmar serviço e proteções
        run: |
          python3 -u - <<'PY'
          import urllib.request,urllib.error,time
          base='https://jmroutes-meli-worker-esp16.fly.dev'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(base+'/health',timeout=20) as r: assert r.status==200
                  break
              except Exception:
                  if attempt==23: raise
                  time.sleep(5)
          with urllib.request.urlopen(base+'/',timeout=20) as r:
              html=r.read().decode()
              assert 'Detalhes por base' in html
          for path in ['/screen','/status']:
              try: urllib.request.urlopen(base+path,timeout=20)
              except urllib.error.HTTPError as e: assert e.code==401
              else: raise AssertionError('Rota deve exigir login')
          print('Página corrigida disponível; rotas privadas protegidas.')
          PY
